<!DOCTYPE html>
<html>
<head>
    <title>UIL Number Sense Practice</title>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { background: #262626; padding: 40px; border-radius: 12px; border: 1px solid #4499aa; text-align: center; width: 80%; max-width: 600px; }
        button { background: #4499aa; color: white; border: none; padding: 12px 24px; cursor: pointer; font-size: 1rem; border-radius: 4px; margin: 5px; }
        input { padding: 12px; font-size: 1.2rem; width: 80%; margin-bottom: 15px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="menu">
            <h1>UIL Number Sense</h1>
            <button onclick="startMode('practice', 'column1')">Practice Column 1</button>
            <button onclick="startMode('drill', 'column1')">Timed Drill (20 Qs)</button>
        </div>

        <div id="quiz" style="display:none;">
            <h2 id="question"></h2>
            <input type="text" id="answer" placeholder="Answer..." autofocus onkeydown="if(event.key==='Enter') checkAnswer()">
            <br>
            <button onclick="checkAnswer()">Submit</button>
            <button onclick="skip()">Skip</button>
            <button onclick="exit()">Exit</button>
            <p id="feedback"></p>
        </div>
    </div>

    <script>
        const questionDatabase = {
            "column1": [
                { "q": "3/4 + 2/3 =", "a": "17/12" },
                { "q": "25 * 215 =", "a": "5375" }
                // Add all your Column 1 questions here
            ],
            "column2": [],
            "column3": [],
            "column4": []
        };

        let mode = '';
        let index = 0;
        let activeQuestions = [];

        function startMode(selectedMode, columnKey) {
            mode = selectedMode;
            index = 0;
            activeQuestions = questionDatabase[columnKey];
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            const randIndex = Math.floor(Math.random() * activeQuestions.length);
            document.getElementById('question').innerText = activeQuestions[randIndex].q;
            document.getElementById('answer').value = "";
            document.getElementById('feedback').innerText = "";
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const userAns = document.getElementById('answer').value;
            const currentQ = activeQuestions.find(i => i.q === document.getElementById('question').innerText);
            
            if(userAns === currentQ.a) {
                document.getElementById('feedback').innerText = "Correct!";
                setTimeout(next, 500);
            } else {
                document.getElementById('feedback').innerText = "Wrong! Answer: " + currentQ.a;
            }
        }

        function next() {
            if (mode === 'drill' && index >= 19) {
                alert("Drill Complete!");
                exit();
            } else {
                index++;
                loadQuestion();
            }
        }

        function skip() { loadQuestion(); }
        function exit() {
            document.getElementById('menu').style.display = 'block';
            document.getElementById('quiz').style.display = 'none';
        }
    </script>
</body>
</html>
