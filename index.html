<!DOCTYPE html>
<html>
<head>
    <title>UIL Number Sense Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="start-screen">
            <h1>UIL Number Sense Practice</h1>
            <button onclick="startQuiz()">Start Drill</button>
        </div>

        <div id="quiz-screen" style="display:none;">
            <h2 id="question"></h2>
            <input type="text" id="answer" placeholder="Answer...">
            <div class="controls">
                <button onclick="checkAnswer()">Submit</button>
                <button onclick="skipQuestion()">Skip</button>
            </div>
            <p id="feedback"></p>
        </div>
    </div>

    <script>
        const uilQuestions = [
            { "q": "118 + 811 - 181 =", "a": "748" },
            { "q": "40 * 125 =", "a": "5000" },
            { "q": "17^2 =", "a": "289" }
        ];

        let currentQuestions = [];
        let index = 0;

        function startQuiz() {
            // Randomize order
            currentQuestions = [...uilQuestions].sort(() => Math.random() - 0.5);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('question').innerText = currentQuestions[index].q;
            document.getElementById('answer').value = "";
            document.getElementById('feedback').innerText = "";
        }

        function checkAnswer() {
            const userAns = document.getElementById('answer').value;
            if(userAns === currentQuestions[index].a) {
                document.getElementById('feedback').innerText = "Correct!";
                setTimeout(next, 800);
            } else {
                document.getElementById('feedback').innerText = "Incorrect. Answer: " + currentQuestions[index].a;
            }
        }

        function skipQuestion() {
            index++;
            if(index < currentQuestions.length) loadQuestion();
        }

        function next() {
            index++;
            if(index < currentQuestions.length) loadQuestion();
            else alert("Drill Finished!");
        }
    </script>
</body>
</html>
