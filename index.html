<!DOCTYPE html>
<html>
<head>
    <title>UIL Number Sense Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Times New Roman', Times, serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #app { background: #262626; padding: 40px; border-radius: 12px; border: 1px solid #4499aa; text-align: center; width: 100%; max-width: 650px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        select { background: #333 !important; color: white !important; border: 1px solid #4499aa !important; padding: 10px; border-radius: 4px; margin-bottom: 15px; width: 80% !important; cursor: pointer; display: block !important; margin-left: auto; margin-right: auto; }
        #question { font-size: 2.2rem; margin: 20px 0; min-height: 50px; }
        button { background: #4499aa; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 1rem; border-radius: 4px; margin: 5px; font-weight: bold; }
        .hud { display: flex; justify-content: space-between; font-size: 1.2rem; color: #44bbaa; margin-bottom: 20px; }
        #timer { color: #ff6b6b; display: none; }
        #review-panel { display: none; background: #1f1f1f; padding: 15px; margin-top: 20px; text-align: left; border-left: 4px solid #44bbaa; }
        #specific-solution { margin-top: 15px; padding: 10px; background: #2a2a2a; border-left: 3px solid #ff6b6b; font-family: monospace; display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div id="menu">
            <h1>UIL Number Sense</h1>
            <select id="source-filter"><option value="all">All Sources</option><option value="official">Official Only</option></select>
            <button onclick="startGlobalPractice()">Global Practice</button>
            <button onclick="showColumns()">Knockout Drill</button>
            <div id="col-select" style="display:none; margin-top:20px;">
                <select id="difficulty-filter"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select>
                <button onclick="startDrill('column1')">Col 1</button><button onclick="startDrill('column2')">Col 2</button>
                <button onclick="startDrill('column3')">Col 3</button><button onclick="startDrill('column4')">Col 4</button>
            </div>
        </div>

        <div id="quiz" style="display:none;">
            <div class="hud"><span id="streak-counter">Streak: 0</span><span id="timer">Time: 9</span></div>
            <h4 id="metadata"></h4> <h2 id="question"></h2>
            <input type="text" id="answer" onkeydown="if(event.key==='Enter') checkAnswer()">
            <div id="action-buttons"><button onclick="checkAnswer()">Submit</button><button onclick="skip()">Skip</button><button onclick="giveUp()">Give Up</button></div>
            <div id="next-buttons" style="display:none;"><button onclick="loadQuestion()">Next Question</button></div>
            <div id="review-panel"><h3 id="trick-title"></h3><p id="trick-text"></p><p id="specific-solution"></p></div>
            <button onclick="exit()">Exit</button>
        </div>
    </div>

    <script src="tricks.js"></script><script src="col1.js"></script><script src="col2.js"></script><script src="col3.js"></script><script src="col4.js"></script>
    <script>
        let mode = '', activeQuestions = [], questionPool = [], currentQ = null, streak = 0, timeLeft = 9, timerInterval;

        function shuffleArray(array) { let arr = [...array]; for(let i=arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
        
        function startGlobalPractice() {
            activeQuestions = [...column1, ...column2, ...column3, ...column4];
            questionPool = shuffleArray(activeQuestions);
            mode = 'practice';
            document.getElementById('timer').style.display = 'none';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            loadQuestion();
        }

        function startDrill(col) {
            activeQuestions = window[col];
            questionPool = shuffleArray(activeQuestions);
            mode = 'drill';
            document.getElementById('timer').style.display = 'block';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            if (questionPool.length === 0) questionPool = shuffleArray(activeQuestions);
            currentQ = questionPool.pop();
            
            document.getElementById('review-panel').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'block';
            document.getElementById('next-buttons').style.display = 'none';
            
            // RESTORED METADATA LOGIC
            document.getElementById('metadata').innerText = `Test ${currentQ.test} | Question #${currentQ.num}`;
            
            document.getElementById('question').innerHTML = `\\(${currentQ.q}\\)`;
            renderMathInElement(document.getElementById('question'), {delimiters: [{left: "\\(", right: "\\)", display: false}]});
            
            if (mode === 'drill') {
                timeLeft = 9;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').innerText = "Time: " + timeLeft;
                    if(timeLeft <= 0) knockout("Time's up!");
                }, 1000);
            }
        }
        
        function triggerReviewState() {
            clearInterval(timerInterval);
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('next-buttons').style.display = 'block';
            document.getElementById('review-panel').style.display = 'block';
            const trick = tricksDatabase[currentQ.trickId];
            document.getElementById('trick-title').innerText = trick.title;
            document.getElementById('trick-text').innerText = trick.text;
            if(currentQ.solution) {
                document.getElementById('specific-solution').innerHTML = "<strong>Walkthrough:</strong><br>" + currentQ.solution;
                document.getElementById('specific-solution').style.display = 'block';
            }
        }

        function checkAnswer() { const userAns = document.getElementById('answer').value.trim(); if(currentQ.a.includes(userAns)) { streak++; triggerReviewState(); } else if(mode==='drill') knockout("Wrong!"); else document.getElementById('feedback').innerText = "Incorrect"; updateHUD(); }
        function skip() { streak = 0; loadQuestion(); }
        function giveUp() { streak = 0; triggerReviewState(); }
        function knockout(reason) { alert(reason); exit(); }
        function exit() { location.reload(); }
        function updateHUD() { document.getElementById('streak-counter').innerText = "Streak: " + streak; }
        function showColumns() { document.getElementById('col-select').style.display = 'block'; }
    </script>
</body>
</html>
