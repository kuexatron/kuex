<!DOCTYPE html>
<html>
<head>
    <title>Number Sense Drill</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #question { font-size: 2em; margin-bottom: 20px; }
        input { font-size: 1.5em; padding: 10px; }
        button { font-size: 1.5em; padding: 10px 20px; }
    </style>
</head>
<body>
    <h1 id="question">Loading...</h1>
    <input type="text" id="answer" placeholder="Answer">
    <button onclick="checkAnswer()">Submit</button>
    <p id="feedback"></p>

    <script>
        const uilQuestions = [
            { "q": "118 + 811 - 181 =", "a": "748" },
            { "q": "40 * 125 =", "a": "5000" },
            { "q": "5/8 + 3/16 =", "a": "13/16" }
        ];

        let current = 0;
        const qEl = document.getElementById('question');
        const fEl = document.getElementById('feedback');
        const aEl = document.getElementById('answer');

        function loadQuestion() {
            qEl.innerText = uilQuestions[current].q;
        }

        function checkAnswer() {
            if(aEl.value === uilQuestions[current].a) {
                fEl.innerText = "Correct!";
            } else {
                fEl.innerText = "Incorrect. Answer: " + uilQuestions[current].a;
            }
            current++;
            if(current < uilQuestions.length) {
                loadQuestion();
                aEl.value = "";
            } else {
                qEl.innerText = "Drill Complete!";
            }
        }
        loadQuestion();
    </script>
</body>
</html>
