<!DOCTYPE html>
<html>
<head>
    <title>UIL Number Sense Practice</title>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Times New Roman', Times, serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { background: #262626; padding: 40px; border-radius: 12px; border: 1px solid #4499aa; text-align: center; width: 80%; max-width: 600px; font-family: sans-serif; }
        
        #metadata { color: #44bbaa; margin: 0 0 10px 0; font-family: sans-serif; font-size: 1rem; }
        #question { font-family: 'Times New Roman', Times, serif; font-size: 2.2rem; letter-spacing: 1px; margin: 10px 0 20px 0; }
        
        button { background: #4499aa; color: white; border: none; padding: 12px 24px; cursor: pointer; font-size: 1rem; border-radius: 4px; margin: 5px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #357a88; transform: scale(1.05); }
        input { padding: 12px; font-size: 1.5rem; width: 80%; margin-bottom: 15px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; text-align: center; }
        
        select { background: #333; color: white; border: 1px solid #4499aa; padding: 10px; font-size: 1rem; border-radius: 4px; margin-bottom: 20px; width: 80%; cursor: pointer; }
        
        .hud { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: #44bbaa; border-bottom: 1px solid #444; padding-bottom: 10px; }
        #timer { color: #ff6b6b; display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div id="menu">
            <h1>UIL Number Sense</h1>
            
            <select id="source-filter">
                <option value="all">All Sources (Official + Auto)</option>
                <option value="official">Official UIL Tests Only</option>
                <option value="heath">Bryan Heath (Auto-Generated) Only</option>
            </select>
            <br>

            <button onclick="startGlobalPractice()">Global Practice (Infinite)</button>
            <button onclick="showColumns()">Knockout Drill</button>
            
            <div id="col-select" style="display:none; margin-top:20px; padding-top: 15px; border-top: 1px solid #444;">
                <h3 style="margin-top: 0;">Select Difficulty & Column</h3>
                
                <select id="difficulty-filter">
                    <option value="easy">Easy (9s to 20s)</option>
                    <option value="medium" selected>Medium (6s to 15s)</option>
                    <option value="hard">Hard / State Qualifier (3s to 12s)</option>
                </select>
                <br>

                <button onclick="startDrill('column1')">Col 1</button>
                <button onclick="startDrill('column2')">Col 2</button>
                <button onclick="startDrill('column3')">Col 3</button>
                <button onclick="startDrill('column4')">Col 4</button>
            </div>
        </div>

        <div id="quiz" style="display:none;">
            <div class="hud">
                <span id="streak-counter">Streak: 0</span>
                <span id="timer">Time: 9</span>
            </div>
            
            <h4 id="metadata"></h4>
            <h2 id="question"></h2>
            
            <input type="text" id="answer" placeholder="Answer..." autofocus autocomplete="off" onkeydown="if(event.key==='Enter') checkAnswer()">
            <br>
            <button onclick="checkAnswer()">Submit</button>
            <button id="skip-btn" onclick="skip()">Skip</button>
            <button onclick="exit()">Exit</button>
            <p id="feedback"></p>
        </div>
    </div>

    <script src="database.js"></script> 
    <script>
        let mode = '', activeQuestions = [], currentQ = null;
        let index = 0, streak = 0, timeLeft = 9, timerInterval;
        let currentDrillTime = 9; 

        // The Timing Matrix
        const drillTimes = {
            'easy': { 'column1': 9, 'column2': 12, 'column3': 15, 'column4': 20 },
            'medium': { 'column1': 6, 'column2': 9, 'column3': 12, 'column4': 15 },
            'hard': { 'column1': 3, 'column2': 5, 'column3': 8, 'column4': 12 }
        };

        function formatMath(str) {
            return str
                .replace(/\^([0-9\-\.]+)/g, '<sup>$1</sup>')
                .replace(/_([0-9a-zA-Z]+)/g, '<sub>$1</sub>')
                .replace(/pi/g, 'π')
                .replace(/sqrt\(/g, '√(')
                .replace(/int /g, '∫ ')
                .replace(/<=/g, '≤')
                .replace(/>=/g, '≥');
        }

        function showColumns() { 
            document.getElementById('col-select').style.display = 'block'; 
        }

        function filterQuestions(questionArray) {
            const filter = document.getElementById('source-filter').value;
            if (filter === 'all') return questionArray;
            return questionArray.filter(q => q.source === filter);
        }

        function startGlobalPractice() {
            let allQ = [...questionDatabase.column1, ...questionDatabase.column2, ...questionDatabase.column3, ...questionDatabase.column4];
            activeQuestions = filterQuestions(allQ);
            
            if (activeQuestions.length === 0) { alert("No questions found for this filter!"); return; }

            mode = 'practice';
            document.getElementById('timer').style.display = 'none';
            document.getElementById('skip-btn').style.display = 'inline-block';
            start();
        }

        function startDrill(col) {
            activeQuestions = filterQuestions(questionDatabase[col]);
            
            if (activeQuestions.length === 0) { alert("No questions found for this filter in " + col + "!"); return; }

            const diff = document.getElementById('difficulty-filter').value;
            currentDrillTime = drillTimes[diff][col];

            mode = 'drill';
            document.getElementById('timer').style.display = 'block';
            document.getElementById('skip-btn').style.display = 'none';
            start();
        }

        function start() {
            streak = 0;
            updateHUD();
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            
            currentQ = activeQuestions[Math.floor(Math.random() * activeQuestions.length)];
            
            let sourceText = currentQ.source === 'official' ? 'Official' : 'Auto';
            document.getElementById('metadata').innerText = `Test ${currentQ.test} | Question #${currentQ.num} | [${sourceText}]`;
            
            document.getElementById('question').innerHTML = formatMath(currentQ.q);
            document.getElementById('answer').value = "";
            document.getElementById('feedback').innerText = "";
            
            // Short delay ensures the browser focuses the input reliably
            setTimeout(() => document.getElementById('answer').focus(), 10);

            if (mode === 'drill') {
                timeLeft = currentDrillTime; 
                document.getElementById('timer').innerText = "Time: " + timeLeft;
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').innerText = "Time: " + timeLeft;
                    if(timeLeft <= 0) { knockout("Time's up!"); }
                }, 1000);
            }
        }

        function checkAnswer() {
            const userAns = document.getElementById('answer').value.trim();
            
            if(userAns === currentQ.a) { 
                streak++;
                updateHUD();
                document.getElementById('feedback').style.color = "#44bbaa";
                document.getElementById('feedback').innerText = "Correct!"; 
                setTimeout(loadQuestion, 300);
            } else { 
                if (mode === 'drill') {
                    knockout("Wrong Answer! The correct answer was: " + currentQ.a);
                } else {
                    streak = 0;
                    updateHUD();
                    document.getElementById('feedback').style.color = "#ff6b6b";
                    document.getElementById('feedback').innerText = "Wrong! Answer: " + currentQ.a; 
                }
            }
        }

        function knockout(reason) {
            clearInterval(timerInterval);
            alert("KNOCKOUT!\n\n" + reason + "\n\nFinal Streak: " + streak);
            exit();
        }

        function updateHUD() { 
            document.getElementById('streak-counter').innerText = "Streak: " + streak; 
        }
        
        function skip() { 
            streak = 0; 
            updateHUD(); 
            loadQuestion(); 
        }
        
        // NEW EXIT FUNCTION: Smoothly resets the UI instead of reloading the page
        function exit() { 
            clearInterval(timerInterval); 
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('menu').style.display = 'block';
            document.getElementById('col-select').style.display = 'none'; // Closes the drill menu
            document.getElementById('answer').value = ""; // Clear input
        }
    </script>
</body>
</html>
