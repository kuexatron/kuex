<!DOCTYPE html>
<html>
<head>
    <title>UIL Number Sense Practice</title>
    <style>
        /* Dark Theme & Centering */
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #app { background: #262626; padding: 40px; border-radius: 12px; border: 1px solid #4499aa; text-align: center; width: 80%; max-width: 500px; }
        button { background: #4499aa; color: white; border: none; padding: 12px 24px; cursor: pointer; font-size: 1rem; border-radius: 4px; margin: 5px; }
        input { padding: 10px; font-size: 1.2rem; width: 80%; margin-bottom: 10px; background: #333; border: 1px solid #555; color: white; }
    </style>
</head>
<body>
    <div id="app">
        <div id="start-screen">
            <h1>UIL Number Sense Practice</h1>
            <button onclick="startQuiz()">Start Drill</button>
        </div>
        <div id="quiz-screen" style="display:none;">
            <h2 id="question"></h2>
            <input type="text" id="answer" placeholder="Answer..." autofocus>
            <br>
            <button onclick="checkAnswer()">Submit</button>
            <button onclick="skipQuestion()">Skip</button>
            <p id="feedback"></p>
        </div>
    </div>

    <script>
        const uilQuestions = [
            { "q": "118 + 811 - 181 =", "a": "748" },
            { "q": "40 * 125 =", "a": "5000" },
            { "q": "17^2 =", "a": "289" },
            { "q": "GCD of 24, 36, 48 is", "a": "12" }
        ];

        let currentQuestions = [];
        let index = 0;

        function startQuiz() {
            // Randomize: Sorts the array into a new random order every time
            currentQuestions = [...uilQuestions].sort(() => Math.random() - 0.5);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('question').innerText = currentQuestions[index].q;
            document.getElementById('answer').value = "";
            document.getElementById('feedback').innerText = "";
            document.getElementById('answer').focus();
        }

        function checkAnswer() {
            const userAns = document.getElementById('answer').value;
            if(userAns === currentQuestions[index].a) {
                document.getElementById('feedback').innerText = "Correct!";
                setTimeout(next, 700);
            } else {
                document.getElementById('feedback').innerText = "Wrong! Answer: " + currentQuestions[index].a;
            }
        }

        function skipQuestion() { next(); }

        function next() {
            index++;
            if(index < currentQuestions.length) loadQuestion();
            else {
                document.getElementById('quiz-screen').innerHTML = "<h1>Drill Complete!</h1><button onclick='location.reload()'>Restart</button>";
            }
        }
    </script>
</body>
</html>
