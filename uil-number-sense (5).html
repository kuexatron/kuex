<!DOCTYPE html>
<html>
<head>
    <title>UIL Number Sense Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Times New Roman', Times, serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        #app { background: #262626; padding: 40px; border-radius: 12px; border: 1px solid #4499aa; text-align: center; width: 100%; max-width: 650px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { padding: 12px; font-size: 1.5rem; width: 80%; margin-bottom: 15px; background: #333 !important; border: 1px solid #555 !important; color: white !important; border-radius: 4px; text-align: center; }
        input:disabled { opacity: 0.7; cursor: not-allowed; }
        select { background: #333 !important; color: white !important; border: 1px solid #4499aa !important; padding: 10px; border-radius: 4px; margin-bottom: 15px; width: 80% !important; display: block; margin: 0 auto 15px; }
        #question { font-size: 1.8rem; margin: 25px 0; color: #fff; letter-spacing: 0.05em; word-spacing: 0.2em; line-height: 1.4; min-height: 60px; overflow-wrap: break-word; word-break: break-word; white-space: normal; max-width: 100%; }
        #question .katex { white-space: normal !important; }
        #question .katex-display { display: inline-block; white-space: normal !important; }
        #metadata { color: #44bbaa; margin: 0 0 5px 0; }
        button { background: #4499aa; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 1rem; border-radius: 4px; margin: 5px; font-weight: bold; }
        button:focus { outline: 2px solid #fff; }
        #bookmark-btn { background: #d4a017; }
        #help-btn { background: #8e44ad; }
        .btn-giveup { background: #ff6b6b; }
        .btn-skip { background: #555555; }
        .hud { display: flex; justify-content: space-between; font-size: 1.2rem; color: #44bbaa; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        #timer { color: #ff6b6b; }
        .title-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; text-align: left; }
        .title-row h1 { margin: 0; font-size: 1.9rem; }
        #source-select { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
        #source-select label { font-size: 0.95rem; white-space: nowrap; cursor: pointer; }
        #source-select input { width: auto !important; margin: 0 6px 0 0; vertical-align: middle; }
        #review-panel { display: none; background: #1f1f1f; padding: 15px; margin-top: 20px; text-align: left; border-left: 4px solid #44bbaa; }
        #review-grid { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-height: 160px; overflow-y: auto; padding: 8px; background: #1f1f1f; border-radius: 4px; }
        .rev-num { width: 38px; height: 34px; padding: 0; margin: 0; font-size: 0.85rem; border-radius: 3px; }
        .rev-correct { background: #2e7d6b; }
        .rev-wrong { background: #b1493f; }
        .rev-skipped { background: #555555; }
        .rev-active { outline: 2px solid #fff; }
        #review-question { font-size: 1.6rem; margin: 10px 0 18px; color: #fff; overflow-wrap: break-word; word-break: break-word; }
        #review-question .katex { white-space: normal !important; }
        #specific-solution { margin-top: 15px; padding: 10px; background: #2a2a2a; border-left: 3px solid #ff6b6b; font-family: monospace; display: none; }
    </style>
</head>
<body>
    <div id="app">
        <div id="menu">
            <div class="title-row">
                <h1>UIL Number Sense</h1>
                <div id="source-select">
                    <label><input type="checkbox" id="src-official" checked onchange="refreshTestDropdowns()"> Official UIL</label>
                    <label><input type="checkbox" id="src-heath" checked onchange="refreshTestDropdowns()"> Bryan Heath</label>
                    <label><input type="checkbox" id="src-monkeysense" checked onchange="refreshTestDropdowns()"> MonkeySense</label>
                </div>
            </div>
            <button onclick="startGlobalPractice()">Global Practice</button>
            <button onclick="showColumns()">Knockout Drill</button>
            <button onclick="showTestMode()">Test Mode</button>
            <div id="col-select" style="display:none; margin-top:20px;">
                <div id="knockout-type-buttons">
                    <button onclick="chooseKnockoutType('endurance')">Endurance (timer per question)</button>
                    <button onclick="chooseKnockoutType('sprint')">Timed Sprint (one clock)</button>
                </div>
                <div id="knockout-main" style="display:none;">
                    <div id="knockout-config" style="margin-bottom:15px;">
                        <label style="display:block; margin-bottom:10px;">Which test?
                            <select id="knockout-test-select" style="margin-top:6px;"></select>
                        </label>
                        <label style="font-size:0.95rem; display:block;"><input type="checkbox" id="knockout-scramble" checked style="width:auto !important; margin-bottom:0;"> Scramble question order</label>
                        <div id="sprint-options" style="display:none; margin-top:10px;">
                            <label style="font-size:0.95rem; display:block;"><input type="checkbox" id="sprint-end-on-wrong" style="width:auto !important; margin-bottom:0;"> End immediately on a wrong answer</label>
                            <label style="font-size:0.95rem; display:block;"><input type="checkbox" id="sprint-skip-feedback" style="width:auto !important; margin-bottom:0;"> Skip correct/incorrect screens</label>
                        </div>
                    </div>
                    <div id="column-buttons">
                        <button onclick="selectColumn('column1')">Column 1 (Q1-20)</button>
                        <button onclick="selectColumn('column2')">Column 2 (Q21-40)</button>
                        <button onclick="selectColumn('column3')">Column 3 (Q41-60)</button>
                        <button onclick="selectColumn('column4')">Column 4 (Q61-80)</button>
                    </div>
                    <div id="pacing-select" style="display:none; margin-top:15px;">
                        <h4 id="pacing-heading" style="color:#44bbaa; margin-bottom:10px; font-weight:normal;">Seconds per question</h4>
                        <div id="endurance-times">
                            <button onclick="selectPacing(10)">10 sec</button>
                            <button onclick="selectPacing(30)">30 sec</button>
                            <button onclick="selectPacing(90)">1 min 30 sec</button>
                            <button onclick="toggleCustomPacing()">Custom</button>
                        </div>
                        <div id="sprint-times" style="display:none;">
                            <button onclick="selectPacing(120)">2 min</button>
                            <button onclick="selectPacing(300)">5 min</button>
                            <button onclick="selectPacing(600)">10 min</button>
                            <button onclick="toggleCustomPacing()">Custom</button>
                        </div>
                        <div id="custom-pacing" style="display:none; margin-top:12px;">
                            <input type="number" id="custom-minutes" min="0" placeholder="Min" style="width:70px; display:inline-block; padding:8px; font-size:1rem; margin-right:5px; margin-bottom:0;">
                            <input type="number" id="custom-seconds" min="0" max="59" placeholder="Sec" style="width:70px; display:inline-block; padding:8px; font-size:1rem; margin-bottom:0;">
                            <button onclick="confirmCustomPacing()" style="display:block; margin:12px auto 0;">Start Drill</button>
                        </div>
                        <button onclick="backToColumns()" style="background:transparent; color:#888; border:1px solid #555; margin-top:15px; display:block; margin-left:auto; margin-right:auto;">Back</button>
                    </div>
                    <button onclick="backToKnockoutType()" style="background:transparent; color:#888; border:1px solid #555; margin-top:15px; display:block; margin-left:auto; margin-right:auto;">Back</button>
                </div>
            </div>
            <div id="test-mode-select" style="display:none; margin-top:20px;">
                <h4 style="color:#44bbaa; margin:0 0 8px; font-weight:normal;">Pick one or more tests</h4>
                <div style="margin-bottom:8px;">
                    <button onclick="setAllTestModeTests(true)" style="padding:6px 12px; font-size:0.85rem;">Select All</button>
                    <button onclick="setAllTestModeTests(false)" style="padding:6px 12px; font-size:0.85rem; background:#555;">Clear</button>
                </div>
                <div id="testmode-test-list" style="max-height:170px; overflow-y:auto; text-align:left; background:#1f1f1f; border:1px solid #444; border-radius:4px; padding:10px; margin-bottom:14px;"></div>
                <label style="font-size:0.95rem; display:block; margin-bottom:6px;"><input type="checkbox" id="testmode-mix" style="width:auto !important; margin-bottom:0;"> Pull random questions from each selected test</label>
                <label style="font-size:0.95rem; display:block; margin-bottom:14px;"><input type="checkbox" id="testmode-scramble" style="width:auto !important; margin-bottom:0;"> Scramble question order</label>
                <button onclick="startTestMode()">Start Test</button>
            </div>
        </div>

        <div id="quiz" style="display:none;">
            <div class="hud"><span id="streak-counter">Streak: 0</span><span id="progress-indicator" style="display:none;"></span><span id="timer" style="display:none;"></span></div>
            <h4 id="metadata"></h4>
            <h2 id="question"></h2>
            <input type="text" id="answer" autocomplete="off" placeholder="Answer..." onkeydown="if(event.key==='Enter') checkAnswer()">
            
            <p id="feedback-msg" style="min-height: 20px; margin: 0 0 15px 0; font-weight: bold; font-size: 1.1rem;"></p>

            <div id="action-buttons">
                <button onclick="checkAnswer()">Submit</button>
                <button class="btn-skip" onclick="skipQuestion()">Skip</button>
                <button id="help-btn" onclick="showTrick()">Help</button>
                <button id="bookmark-btn" onclick="toggleBookmark()">Bookmark</button>
            </div>
            <div id="reveal-buttons" style="display:none;">
                <button onclick="checkAnswer()">Submit</button>
                <button class="btn-giveup" onclick="giveUp()">Give Up</button>
            </div>
            <div id="next-buttons" style="display:none;">
                <button id="btn-next" onclick="goToNextQuestion()">Continue</button>
                <button onclick="location.reload()" style="background:transparent; color:#888; border:1px solid #555;">Back to Menu</button>
            </div>
            <div id="review-panel">
                <h3 id="trick-title"></h3>
                <p id="trick-text"></p>
                <p id="specific-solution"></p>
            </div>
            <button onclick="location.reload()" style="background:transparent; color:#888; border:1px solid #555; margin-top:20px;">Exit to Menu</button>
        </div>

        <div id="review-screen" style="display:none;">
            <h2 id="review-score" style="color:#44bbaa; margin-top:0; white-space:pre-line;"></h2>
            <p style="color:#888; font-size:0.9rem; margin-top:-10px;">Tap a number to jump, or use the arrows. Arrow keys work too.</p>
            <div id="review-grid"></div>
            <div style="display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px;">
                <button onclick="reviewStep(-1)" style="font-size:1.3rem; padding:8px 18px;">&#8592;</button>
                <span id="review-position" style="color:#44bbaa; font-size:1.1rem;"></span>
                <button onclick="reviewStep(1)" style="font-size:1.3rem; padding:8px 18px;">&#8594;</button>
            </div>
            <h4 id="review-metadata" style="color:#44bbaa; margin:0 0 5px;"></h4>
            <h2 id="review-question"></h2>
            <div id="review-answers" style="text-align:left; background:#1f1f1f; padding:14px; border-radius:4px; margin-bottom:14px;"></div>
            <div id="review-trick" style="text-align:left; background:#1f1f1f; padding:14px; border-left:4px solid #44bbaa;"></div>
            <button onclick="location.reload()" style="background:transparent; color:#888; border:1px solid #555; margin-top:20px;">Exit to Menu</button>
        </div>
    </div>



    <script>
const tricksDatabase = {
    "t_raw_math": { "title": "Basic Arithmetic", "text": "Pure arithmetic calculation. Do the mental math left-to-right as quickly as possible." },
    "t_order_of_operations": { "title": "Order of Operations", "text": "Follow PEMDAS. 1) Parentheses. 2) Exponents. 3) Mult/Div. 4) Add/Sub." },

    "t_roman_num": { "title": "Roman Numerals", "text": "M=1000, D=500, C=100, L=50, X=10, V=5, I=1." },

    "t_distributive": { "title": "Distributive Property", "text": "Break one number into easier parts. (e.g., 12 * 17 = 12 * 10 + 12 * 7)." },

    "t_negative_zero_exponents": { "title": "Negative Exponents", "text": "x^0 = 1. Negative exponent is a reciprocal: x^-n = 1 / x^n." },
    "t_gcd_lcm": { "title": "GCD and LCM", "text": "GCD(A,B) * LCM(A,B) = A * B." },

    "t_absolute_value": { "title": "Absolute Value", "text": "Work from the inside out. All negative results become positive." },
    "t_magic_14443": { "title": "Magic 14443", "text": "Memorize: 14443 * 7 = 101101." },
    "t_diff_squares": { "title": "Difference of Squares", "text": "a^2 - b^2 = (a-b)(a+b)." },
    "t_proportions": { "title": "Proportions", "text": "Set up equation A * B = C * x and simplify." },
    "t_set_intersection": { "title": "Set Intersection", "text": "Count only the elements that exist in BOTH sets." },
    "t_perfect_sq_trinomial": { "title": "Perfect Square Trinomial", "text": "a^2 - 2ab + b^2 = (a-b)^2." },
    "t_linear_equation": { "title": "Linear Equations", "text": "Group variables on one side, constants on the other." },
    "t_mult_3x3": { "title": "3x3 Multiplication", "text": "Cross-multiply moving right to left: 1, 2, 3, 2, 1 columns." },
    "t_shared_factor": { "title": "Shared Factor", "text": "Pull out a common factor before doing the math." },
    "t_exponent_rules": { "title": "Exponent Rules", "text": "Multiply bases = add exponents. Divide = subtract." },
    "t_linear_inequality": { "title": "Inequalities", "text": "Solve normally, but flip the sign if multiplying/dividing by negative." },
    "t_mult_units_10": { "title": "Units Add to 10", "text": "Multiply units. Multiply front digit by (itself + 1)." },
    "t_trig_reference_angles": { "title": "Trig Reference", "text": "Subtract 2pi until angle is on standard unit circle." },
    "t_trig_unit_circle": { "title": "Unit Circle", "text": "Recall standard values. Tan = Sin / Cos." },
    "t_alt_sum_squares": { "title": "Alternating Sum Squares", "text": "For series ending on -n^2: -[n(n+1)/2]." },
    "t_log_properties": { "title": "Log Properties", "text": "ln(e^x) = x." },
    "t_limit_ex": { "title": "Calculus Limits", "text": "lim x->0 (e^x-1)/x = 1." },
    "t_calc_power_rule": { "title": "Power Rule", "text": "f'(x) of cx^n = (c*n)x^(n-1)." },
    "t_inverse_trig": { "title": "Inverse Trig", "text": "Draw right triangle to find missing side." },
    "t_mult_11": { "title": "Multiplying by 11", "text": "Write ones digit, add consecutive digits moving left." },
    "t_sum_of_cubes": { "title": "Sum of Cubes", "text": "[n(n+1)/2]^2." },
    "t_calc_definite_integral": { "title": "Definite Integrals", "text": "Antiderivative evaluated at upper minus lower bounds." },
    "t_rational_asymptotes": { "title": "Asymptotes", "text": "Vertical where denom=0. Slant/Horiz based on degrees." },
    "t_inverse_function_point": { "title": "Inverse Functions", "text": "Set f(x) equal to value and solve for x." },
    "t_nested_logs": { "title": "Nested Logs", "text": "Evaluate inside out." },
    "t_geom_series_inf": { "title": "Infinite Geometric", "text": "S = a / (1 - r)." },
    "t_consecutive_mult": { "title": "Consecutive Mult", "text": "n*(n+1) = n^2 + n." },
    "t_diff_sq_reverse": { "title": "Reverse Diff Squares", "text": "(n-1)(n+1) = n^2 - 1." },
    "t_lcm_gcd_calc": { "title": "Finding GCD and LCM", "text": "Factor both numbers. GCD is the product of shared prime factors at their lowest powers; LCM uses every prime at its highest power." },
    "t_double_half": { "title": "Double and Half", "text": "Double one factor, halve the other." }
};

    </script>

    <script>
        window.onerror = function(msg, src, ln) { alert("Data Error in " + src + " on line " + ln + "\nCheck for missing/extra commas."); };

        let mode = '', activeQuestions = [], questionPool = [], currentQ = null, streak = 0, timerInterval;
        let errorToggle = false; 
        let bookmarks = JSON.parse(localStorage.getItem('ns_bookmarks') || '[]');
        let pendingColumn = null, drillSeconds = 10;
        let currentSequential = false;
        let testModeQuestions = [], testModeIndex = 0, testModeScore = 0;
        let testModeResults = [], reviewIndex = 0;
        let reviewQuestions = [], reviewResultsList = [];
        let runLog = [];
        let knockoutType = 'endurance';
        let sprintEndOnWrong = false, sprintSkipFeedback = false;
        let sprintCorrect = 0, sprintAnswered = 0, sprintTimeLeft = 0;

        const SOURCE_LABELS = { official: "Official UIL", heath: "Bryan Heath", monkeysense: "MonkeySense" };

        // Shrinks the question's font size step-by-step until the rendered
        // content (text or KaTeX math) fits within the box width instead of
        // overflowing off-screen. Long content still wraps to new lines
        // (via the CSS above) and grows the box downward; this only kicks
        // in for a single unbreakable chunk (e.g. one long expression)
        // that would otherwise stay on one line and run off the edge.
        function fitQuestionText(el) {
            const minFontPx = 17; // ~1.06rem floor so text stays readable
            let fontSize = 28.8; // 1.8rem baseline in px (assumes 16px root)
            el.style.fontSize = fontSize + "px";
            let guard = 0;
            while (el.scrollWidth > el.clientWidth && fontSize > minFontPx && guard < 20) {
                fontSize -= 1.5;
                el.style.fontSize = fontSize + "px";
                guard++;
            }
        }

        function normalize(str) { return str.toLowerCase().replace(/&/g, ' ').replace(/\s+/g, ''); }
        function shuffleArray(array) { let arr = [...array]; for(let i=arr.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
        function formatTime(totalSeconds) {
            if (totalSeconds < 0) totalSeconds = 0;
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            return m > 0 ? `${m}:${s.toString().padStart(2, '0')}` : `${s}`;
        }

        function getSelectedSources() {
            let s = new Set();
            if (document.getElementById('src-official').checked) s.add('official');
            if (document.getElementById('src-heath').checked) s.add('heath');
            if (document.getElementById('src-monkeysense').checked) s.add('monkeysense');
            return s;
        }

        function getAllQuestions() { return [...column1, ...column2, ...column3, ...column4]; }

        function getFilteredQuestions(rawArray) {
            const sources = getSelectedSources();
            if (sources.size === 0) return [];
            return rawArray.filter(q => sources.has(q.source));
        }

        function getAvailableTests() {
            const sources = getSelectedSources();
            const map = {};
            getAllQuestions().forEach(q => { if (sources.has(q.source)) map[q.test] = q.source; });
            return Object.keys(map).sort().map(t => ({ test: t, source: map[t] }));
        }

        function populateTestSelect(selectId, includeAllOption) {
            const sel = document.getElementById(selectId);
            const prevValue = sel.value;
            const tests = getAvailableTests();
            sel.innerHTML = "";
            if (includeAllOption) {
                let opt = document.createElement('option');
                opt.value = 'all';
                opt.text = 'All Tests (Mixed)';
                sel.appendChild(opt);
            }
            tests.forEach(t => {
                let opt = document.createElement('option');
                opt.value = t.test;
                opt.text = "Test " + t.test + " (" + (SOURCE_LABELS[t.source] || t.source) + ")";
                sel.appendChild(opt);
            });
            if ([...sel.options].some(o => o.value === prevValue)) sel.value = prevValue;
        }

        function refreshTestDropdowns() {
            populateTestSelect('knockout-test-select', true);
            if (document.getElementById('testmode-test-list')) populateTestModeList();
        }

        function startGlobalPractice() {
            currentSequential = false;
            let all = [...column1, ...column2, ...column3, ...column4];
            activeQuestions = getFilteredQuestions(all);
            if(activeQuestions.length === 0) { alert("No questions matched filter."); return; }
            questionPool = shuffleArray(activeQuestions);
            mode = 'practice';
            document.getElementById('timer').style.display = 'none';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            loadQuestion();
        }

        function chooseKnockoutType(type) {
            knockoutType = type;
            document.getElementById('knockout-type-buttons').style.display = 'none';
            document.getElementById('knockout-main').style.display = 'block';
            document.getElementById('sprint-options').style.display = (type === 'sprint') ? 'block' : 'none';
            populateTestSelect('knockout-test-select', true);
        }

        function backToKnockoutType() {
            document.getElementById('knockout-main').style.display = 'none';
            document.getElementById('pacing-select').style.display = 'none';
            document.getElementById('custom-pacing').style.display = 'none';
            document.getElementById('column-buttons').style.display = 'block';
            document.getElementById('knockout-type-buttons').style.display = 'block';
        }

        function selectColumn(colName) {
            pendingColumn = colName;
            document.getElementById('column-buttons').style.display = 'none';
            document.getElementById('pacing-select').style.display = 'block';
            const isSprint = (knockoutType === 'sprint');
            document.getElementById('pacing-heading').innerText = isSprint ? "Total time for the sprint" : "Seconds per question";
            document.getElementById('endurance-times').style.display = isSprint ? 'none' : 'block';
            document.getElementById('sprint-times').style.display = isSprint ? 'block' : 'none';
        }

        function backToColumns() {
            document.getElementById('pacing-select').style.display = 'none';
            document.getElementById('custom-pacing').style.display = 'none';
            document.getElementById('column-buttons').style.display = 'block';
        }

        function toggleCustomPacing() {
            let cp = document.getElementById('custom-pacing');
            cp.style.display = (cp.style.display === 'block') ? 'none' : 'block';
        }

        function selectPacing(seconds) {
            drillSeconds = seconds;
            beginDrill(pendingColumn);
        }

        function confirmCustomPacing() {
            let min = parseInt(document.getElementById('custom-minutes').value) || 0;
            let sec = parseInt(document.getElementById('custom-seconds').value) || 0;
            let total = (min * 60) + sec;
            if (total <= 0) { alert("Enter a time greater than 0 seconds."); return; }
            drillSeconds = total;
            beginDrill(pendingColumn);
        }

        function beginDrill(colName) {
            let selectedCol;
            if (colName === 'column1') selectedCol = column1;
            else if (colName === 'column2') selectedCol = column2;
            else if (colName === 'column3') selectedCol = column3;
            else if (colName === 'column4') selectedCol = column4;

            let filtered = getFilteredQuestions(selectedCol);
            const testFilter = document.getElementById('knockout-test-select').value;
            if (testFilter && testFilter !== 'all') {
                filtered = filtered.filter(q => q.test === testFilter);
            }
            if (filtered.length === 0) { alert("No questions matched your filters."); return; }

            filtered.sort((a, b) => parseInt(a.num) - parseInt(b.num));
            const scramble = document.getElementById('knockout-scramble').checked;
            currentSequential = !scramble;
            activeQuestions = filtered;
            questionPool = scramble ? shuffleArray(activeQuestions) : [...activeQuestions].reverse();

            if (knockoutType === 'sprint') {
                sprintEndOnWrong = document.getElementById('sprint-end-on-wrong').checked;
                sprintSkipFeedback = document.getElementById('sprint-skip-feedback').checked;
                sprintCorrect = 0;
                sprintAnswered = 0;
                mode = 'sprint';
            } else {
                mode = 'drill';
            }

            runLog = [];
            document.getElementById('timer').style.display = 'block';
            document.getElementById('streak-counter').style.display = 'inline';
            document.getElementById('progress-indicator').style.display = 'none';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            if (mode === 'sprint') startSprintClock();
            loadQuestion();
        }

        // The sprint clock runs continuously across questions, unlike the
        // endurance drill where the timer restarts for each question.
        function startSprintClock() {
            clearInterval(timerInterval);
            sprintTimeLeft = drillSeconds;
            document.getElementById('timer').innerText = "Time: " + formatTime(sprintTimeLeft);
            timerInterval = setInterval(() => {
                sprintTimeLeft--;
                document.getElementById('timer').innerText = "Time: " + formatTime(sprintTimeLeft);
                if (sprintTimeLeft <= 0) endSprint("Time's up!");
            }, 1000);
        }

        function endSprint(reason) {
            endRun(reason + "\nCorrect: " + sprintCorrect + " of " + sprintAnswered + " answered.\nBest streak this run: " + streak);
        }

        function loadQuestion() {
            // In sprint mode the clock spans the whole run, so it must survive
            // question changes; every other mode resets its timer here.
            if (mode !== 'sprint') clearInterval(timerInterval);
            if (questionPool.length === 0) questionPool = currentSequential ? [...activeQuestions].reverse() : shuffleArray(activeQuestions);
            currentQ = questionPool.pop();
            if (mode === 'drill' || mode === 'sprint') runLog.push({ q: currentQ, status: null, given: null });
            
            document.getElementById('review-panel').style.display = 'none';
            document.getElementById('specific-solution').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'block';
            document.getElementById('reveal-buttons').style.display = 'none';
            document.getElementById('next-buttons').style.display = 'none';
            
            let ansInput = document.getElementById('answer');
            ansInput.disabled = false;
            ansInput.value = "";
            ansInput.style.color = "white";
            ansInput.focus();
            
            document.getElementById('feedback-msg').innerText = ""; 
            document.getElementById('metadata').innerText = `Test ${currentQ.test} | Question #${currentQ.num}`;
            
            let formatText = currentQ.format ? ` <span style="font-size: 1.2rem; color: #aaaaaa;">(${currentQ.format})</span>` : "";
            let qEl = document.getElementById('question');
            qEl.style.fontSize = "1.8rem";
            qEl.innerHTML = `\\(${currentQ.q}\\)` + formatText;
            
            renderMathInElement(qEl, {delimiters: [{left: "\\(", right: "\\)", display: false}]});
            fitQuestionText(qEl);
            
            if(mode === 'drill') {
                let timeLeft = drillSeconds;
                document.getElementById('timer').innerText = "Time: " + formatTime(timeLeft);
                timerInterval = setInterval(() => { 
                    timeLeft--; 
                    document.getElementById('timer').innerText = "Time: " + formatTime(timeLeft); 
                    if(timeLeft <= 0) {
                        runLog[runLog.length - 1] = { q: currentQ, status: 'skipped', given: '' };
                        endRun("Knockout! Time's up.\nStreak: " + streak);
                    } 
                }, 1000);
            }
        }
        
        function checkAnswer() {
            if (mode === 'test') { checkTestModeAnswer(); return; }
            const userAnsRaw = document.getElementById('answer').value;
            const userAns = normalize(userAnsRaw);
            const correctList = currentQ.a.map(a => normalize(a));
            let feedback = document.getElementById('feedback-msg');
            
            let isCorrect = correctList.includes(userAns);

            // UIL 5% Estimation Check Logic (Activates on every 10th question)
            if (!isCorrect && parseInt(currentQ.num) % 10 === 0) {
                let userNum = parseFloat(userAnsRaw.replace(/,/g, ''));
                if (!isNaN(userNum) && currentQ.solution) {
                    let match = currentQ.solution.match(/range:\s*(-?\d+\.?\d*)\s*(?:-|to)\s*(-?\d+\.?\d*)/i);
                    if (match) {
                        let lower = parseFloat(match[1]);
                        let upper = parseFloat(match[2]);
                        if (userNum >= lower && userNum <= upper) {
                            isCorrect = true;
                        }
                    }
                }
            }
            
            if (mode === 'sprint') sprintAnswered++;

            if (isCorrect) {
                streak++;
                if (mode === 'sprint') sprintCorrect++;
                if (mode === 'drill' || mode === 'sprint') {
                    runLog[runLog.length - 1] = { q: currentQ, status: 'correct', given: userAnsRaw };
                }
                document.getElementById('streak-counter').innerText = "Streak: " + streak;

                // Sprint runs can opt out of the result screens entirely and
                // roll straight into the next question.
                if (mode === 'sprint' && sprintSkipFeedback) { loadQuestion(); return; }

                showResultScreen(true);
            } else {
                if (mode === 'drill') {
                    runLog[runLog.length - 1] = { q: currentQ, status: 'wrong', given: userAnsRaw };
                    endRun("Knockout! Wrong Answer.\nCorrect was: " + currentQ.a[0] + "\nStreak: " + streak);
                    return;
                }
                streak = 0;
                document.getElementById('streak-counter').innerText = "Streak: " + streak;

                if (mode === 'sprint') {
                    runLog[runLog.length - 1] = { q: currentQ, status: 'wrong', given: userAnsRaw };
                    if (sprintEndOnWrong) {
                        endSprint("Knockout! Wrong answer.\nCorrect was: " + currentQ.a[0]);
                        return;
                    }
                    if (sprintSkipFeedback) { loadQuestion(); return; }
                    showResultScreen(false);
                    return;
                }

                document.getElementById('answer').style.color = "#ff6b6b";
                errorToggle = !errorToggle;
                feedback.innerText = errorToggle
                    ? "Answer is incorrect. Try again!"
                    : "Still incorrect. Give it another shot!";
                feedback.style.color = "#ff6b6b";
            }
        }

        // Shared result screen. On a correct answer it shows the same trick
        // panel the Help button would, so the tip reinforces what they just
        // solved, plus Continue / Back to Menu. The per-question timer is
        // stopped so a won question never keeps counting down on them.
        function showResultScreen(isCorrect) {
            if (mode !== 'sprint') clearInterval(timerInterval);

            let feedback = document.getElementById('feedback-msg');
            let ansInput = document.getElementById('answer');
            ansInput.disabled = true;

            if (isCorrect) {
                ansInput.style.color = "#44bbaa";
                feedback.innerText = "Correct!";
                feedback.style.color = "#44bbaa";
            } else {
                ansInput.style.color = "#ff6b6b";
                feedback.innerText = "Incorrect. Answer: " + currentQ.a[0];
                feedback.style.color = "#ff6b6b";
            }

            const trick = tricksDatabase[currentQ.trickId] || {"title":"No trick mapped", "text":"General arithmetic problem."};
            document.getElementById('trick-title').innerText = "Trick: " + trick.title;
            document.getElementById('trick-text').innerText = trick.text;
            document.getElementById('review-panel').style.display = 'block';

            if (currentQ.solution) {
                document.getElementById('specific-solution').innerHTML = "<strong>Walkthrough:</strong><br>" + currentQ.solution;
                document.getElementById('specific-solution').style.display = 'block';
            }

            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('reveal-buttons').style.display = 'none';
            document.getElementById('next-buttons').style.display = 'block';
            document.getElementById('btn-next').focus();
        }

        function skipQuestion() {
            if (mode === 'test') { skipTestModeQuestion(); return; }
            if (mode !== 'sprint') clearInterval(timerInterval);
            if (mode === 'drill' || mode === 'sprint') {
                runLog[runLog.length - 1] = { q: currentQ, status: 'skipped', given: '' };
            }
            streak = 0;
            document.getElementById('streak-counter').innerText = "Streak: " + streak;
            loadQuestion();
        }

        function showTrick() {
            document.getElementById('review-panel').style.display = 'block';
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('reveal-buttons').style.display = 'block';
            const trick = tricksDatabase[currentQ.trickId] || {"title":"No trick mapped", "text":"General arithmetic problem."};
            document.getElementById('trick-title').innerText = "Trick: " + trick.title;
            document.getElementById('trick-text').innerText = trick.text;
        }

        function giveUp() {
            if (mode !== 'sprint') clearInterval(timerInterval);
            if (mode === 'drill' || mode === 'sprint') {
                runLog[runLog.length - 1] = { q: currentQ, status: 'wrong', given: '(gave up)' };
            }
            streak = 0;
            document.getElementById('streak-counter').innerText = "Streak: " + streak;
            document.getElementById('answer').disabled = true;
            document.getElementById('answer').value = currentQ.a[0];
            document.getElementById('answer').style.color = "#ff6b6b";
            document.getElementById('feedback-msg').innerText = ""; 
            document.getElementById('reveal-buttons').style.display = 'none';
            document.getElementById('next-buttons').style.display = 'block';
            document.getElementById('btn-next').focus();
            if(currentQ.solution) {
                document.getElementById('specific-solution').innerHTML = "<strong>Walkthrough:</strong><br>" + currentQ.solution;
                document.getElementById('specific-solution').style.display = 'block';
            }
        }

        function toggleBookmark() {
            if (bookmarks.includes(currentQ.id)) { 
                bookmarks = bookmarks.filter(b => b !== currentQ.id); 
                alert("Bookmark Removed"); 
            } else { 
                bookmarks.push(currentQ.id); 
                alert("Bookmarked!"); 
            }
            localStorage.setItem('ns_bookmarks', JSON.stringify(bookmarks));
        }

        function showColumns() {
            document.getElementById('col-select').style.display = 'block';
            document.getElementById('knockout-type-buttons').style.display = 'block';
            document.getElementById('knockout-main').style.display = 'none';
            populateTestSelect('knockout-test-select', true);
        }

        function showTestMode() {
            document.getElementById('test-mode-select').style.display = 'block';
            populateTestModeList();
        }

        function populateTestModeList() {
            const container = document.getElementById('testmode-test-list');
            const previously = new Set(getSelectedTestModeTests());
            const tests = getAvailableTests();
            container.innerHTML = "";
            if (tests.length === 0) {
                container.innerHTML = '<span style="color:#888;">No tests available for the selected sources.</span>';
                return;
            }
            tests.forEach(t => {
                const label = document.createElement('label');
                label.style.cssText = "display:block; font-size:0.95rem; margin-bottom:4px; cursor:pointer;";
                const box = document.createElement('input');
                box.type = 'checkbox';
                box.id = 'tm-test-' + t.test;
                box.value = t.test;
                box.className = 'tm-test-box';
                box.style.cssText = "width:auto !important; margin:0 6px 0 0; vertical-align:middle;";
                // Keep prior ticks when the source filters change; default to
                // checked the first time a test appears in the list.
                box.checked = previously.size ? previously.has(t.test) : true;
                label.appendChild(box);
                label.appendChild(document.createTextNode("Test " + t.test + " (" + (SOURCE_LABELS[t.source] || t.source) + ")"));
                container.appendChild(label);
            });
        }

        function getSelectedTestModeTests() {
            return [...document.querySelectorAll('.tm-test-box')].filter(b => b.checked).map(b => b.value);
        }

        function setAllTestModeTests(state) {
            document.querySelectorAll('.tm-test-box').forEach(b => { b.checked = state; });
        }

        // Slot-preserving mix: for each question number, choose randomly among
        // the selected tests that have that slot. A question never moves to a
        // different number — only which test supplies it changes.
        function buildMixedSet(pool) {
            const byNum = {};
            pool.forEach(q => {
                const n = parseInt(q.num);
                if (!byNum[n]) byNum[n] = [];
                byNum[n].push(q);
            });
            return Object.keys(byNum)
                .map(Number)
                .sort((a, b) => a - b)
                .map(n => byNum[n][Math.floor(Math.random() * byNum[n].length)]);
        }

        function startTestMode() {
            const selected = getSelectedTestModeTests();
            if (selected.length === 0) { alert("Select at least one test."); return; }

            let pool = getFilteredQuestions(getAllQuestions()).filter(q => selected.includes(q.test));
            if (pool.length === 0) { alert("No questions matched your filters."); return; }

            let set;
            if (document.getElementById('testmode-mix').checked) {
                set = buildMixedSet(pool);
            } else {
                // No mixing: play the selected tests through, each in order.
                set = pool.sort((a, b) =>
                    a.test === b.test ? parseInt(a.num) - parseInt(b.num) : a.test.localeCompare(b.test)
                );
            }

            startTestModeSession(set, document.getElementById('testmode-scramble').checked);
        }

        function startTestModeSession(set, scramble) {
            testModeQuestions = scramble ? shuffleArray(set) : [...set];
            testModeIndex = 0;
            testModeScore = 0;
            testModeResults = [];
            mode = 'test';
            document.getElementById('menu').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('timer').style.display = 'block';
            document.getElementById('streak-counter').style.display = 'none';
            document.getElementById('progress-indicator').style.display = 'inline';
            startTestModeTimer();
            loadTestModeQuestion();
        }

        function startTestModeTimer() {
            clearInterval(timerInterval);
            let timeLeft = 600; // 10 minutes total, matching real UIL Number Sense timing
            document.getElementById('timer').innerText = "Time: " + formatTime(timeLeft);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = "Time: " + formatTime(timeLeft);
                if (timeLeft <= 0) { endTestMode(); }
            }, 1000);
        }

        function loadTestModeQuestion() {
            if (testModeIndex >= testModeQuestions.length) { endTestMode(); return; }
            currentQ = testModeQuestions[testModeIndex];

            document.getElementById('review-panel').style.display = 'none';
            document.getElementById('specific-solution').style.display = 'none';
            document.getElementById('action-buttons').style.display = 'block';
            document.getElementById('reveal-buttons').style.display = 'none';
            document.getElementById('next-buttons').style.display = 'none';

            let ansInput = document.getElementById('answer');
            ansInput.disabled = false;
            ansInput.value = "";
            ansInput.style.color = "white";
            ansInput.focus();

            document.getElementById('feedback-msg').innerText = "";
            document.getElementById('metadata').innerText = `Test ${currentQ.test} | Question #${currentQ.num}`;
            document.getElementById('progress-indicator').innerText = `Q ${testModeIndex + 1} of ${testModeQuestions.length}`;

            let formatText = currentQ.format ? ` <span style="font-size: 1.2rem; color: #aaaaaa;">(${currentQ.format})</span>` : "";
            let qEl = document.getElementById('question');
            qEl.style.fontSize = "1.8rem";
            qEl.innerHTML = `\\(${currentQ.q}\\)` + formatText;
            renderMathInElement(qEl, {delimiters: [{left: "\\(", right: "\\)", display: false}]});
            fitQuestionText(qEl);
        }

        function checkTestModeAnswer() {
            const userAnsRaw = document.getElementById('answer').value;
            const userAns = normalize(userAnsRaw);
            const correctList = currentQ.a.map(a => normalize(a));
            let isCorrect = correctList.includes(userAns);

            if (!isCorrect && parseInt(currentQ.num) % 10 === 0) {
                let userNum = parseFloat(userAnsRaw.replace(/,/g, ''));
                if (!isNaN(userNum) && currentQ.solution) {
                    let match = currentQ.solution.match(/range:\s*(-?\d+\.?\d*)\s*(?:-|to)\s*(-?\d+\.?\d*)/i);
                    if (match) {
                        let lower = parseFloat(match[1]), upper = parseFloat(match[2]);
                        if (userNum >= lower && userNum <= upper) isCorrect = true;
                    }
                }
            }

            let feedback = document.getElementById('feedback-msg');
            let ansInput = document.getElementById('answer');
            ansInput.disabled = true;
            testModeResults[testModeIndex] = { status: isCorrect ? 'correct' : 'wrong', given: userAnsRaw };
            if (isCorrect) {
                testModeScore++;
                ansInput.style.color = "#44bbaa";
                feedback.innerText = "Correct!";
                feedback.style.color = "#44bbaa";
            } else {
                ansInput.style.color = "#ff6b6b";
                feedback.innerText = "Incorrect. Answer: " + currentQ.a[0];
                feedback.style.color = "#ff6b6b";
            }
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('next-buttons').style.display = 'block';
            document.getElementById('btn-next').focus();
        }

        function skipTestModeQuestion() {
            if (!testModeResults[testModeIndex]) {
                testModeResults[testModeIndex] = { status: 'skipped', given: '' };
            }
            testModeIndex++;
            loadTestModeQuestion();
        }

        function endTestMode() {
            clearInterval(timerInterval);
            // Anything never reached (ran out of time) counts as skipped so the
            // review grid accounts for all 80 slots, not just answered ones.
            for (let i = 0; i < testModeQuestions.length; i++) {
                if (!testModeResults[i]) testModeResults[i] = { status: 'skipped', given: '' };
            }
            showReviewScreen(
                testModeQuestions,
                testModeResults,
                "Score: " + testModeScore + " / " + testModeQuestions.length
            );
        }

        // Shared ending for Knockout Drill (endurance and sprint): converts
        // the run log built up as questions were served into the same
        // review format the Test Mode summary uses.
        function endRun(message) {
            clearInterval(timerInterval);
            const questions = runLog.map(e => e.q);
            const results = runLog.map(e => ({ status: e.status || 'skipped', given: e.given || '' }));
            showReviewScreen(questions, results, message);
        }

        function showReviewScreen(questions, results, scoreText) {
            reviewQuestions = questions;
            reviewResultsList = results;
            document.getElementById('quiz').style.display = 'none';
            document.getElementById('review-screen').style.display = 'block';
            document.getElementById('review-score').innerText = scoreText;
            reviewIndex = 0;
            renderReviewGrid();
            loadReviewQuestion();
        }

        function renderReviewGrid() {
            const grid = document.getElementById('review-grid');
            grid.innerHTML = "";
            reviewQuestions.forEach((q, i) => {
                const btn = document.createElement('button');
                const res = reviewResultsList[i] || { status: 'skipped' };
                btn.className = 'rev-num ' + (
                    res.status === 'correct' ? 'rev-correct' :
                    res.status === 'wrong'   ? 'rev-wrong'   : 'rev-skipped'
                );
                btn.innerText = q.num;
                btn.title = "Question " + q.num + " (Test " + q.test + ")";
                btn.onclick = () => jumpToReview(i);
                grid.appendChild(btn);
            });
            highlightReviewGrid();
        }

        function highlightReviewGrid() {
            const boxes = document.querySelectorAll('.rev-num');
            boxes.forEach((b, i) => b.classList.toggle('rev-active', i === reviewIndex));
            const active = boxes[reviewIndex];
            if (active) active.scrollIntoView({ block: 'nearest' });
        }

        function jumpToReview(i) {
            reviewIndex = i;
            loadReviewQuestion();
        }

        function reviewStep(delta) {
            const next = reviewIndex + delta;
            if (next < 0 || next >= reviewQuestions.length) return;
            reviewIndex = next;
            loadReviewQuestion();
        }

        function loadReviewQuestion() {
            const q = reviewQuestions[reviewIndex];
            const res = reviewResultsList[reviewIndex] || { status: 'skipped', given: '' };

            document.getElementById('review-position').innerText =
                "Question " + (reviewIndex + 1) + " of " + reviewQuestions.length;
            document.getElementById('review-metadata').innerText =
                "Test " + q.test + " | Question #" + q.num;

            let formatText = q.format ? ` <span style="font-size: 1.1rem; color: #aaaaaa;">(${q.format})</span>` : "";
            const qEl = document.getElementById('review-question');
            qEl.innerHTML = `\\(${q.q}\\)` + formatText;
            renderMathInElement(qEl, {delimiters: [{left: "\\(", right: "\\)", display: false}]});

            let verdict, colour;
            if (res.status === 'correct')      { verdict = "Correct"; colour = "#44bbaa"; }
            else if (res.status === 'wrong')   { verdict = "Incorrect"; colour = "#ff6b6b"; }
            else                               { verdict = "Skipped / unanswered"; colour = "#aaaaaa"; }

            let answersHtml = `<div style="color:${colour}; font-weight:bold; margin-bottom:8px;">${verdict}</div>`;
            if (res.status !== 'skipped') {
                answersHtml += `<div style="margin-bottom:6px;">Your answer: <span style="color:${colour};">${escapeHtml(res.given) || "(blank)"}</span></div>`;
            }
            answersHtml += `<div>Correct answer: <span style="color:#44bbaa;">${escapeHtml(q.a[0])}</span></div>`;
            if (q.a.length > 1) {
                answersHtml += `<div style="color:#888; font-size:0.85rem; margin-top:4px;">Also accepted: ${q.a.slice(1).map(escapeHtml).join(", ")}</div>`;
            }
            document.getElementById('review-answers').innerHTML = answersHtml;

            const trick = tricksDatabase[q.trickId] || {"title":"No trick mapped", "text":"General arithmetic problem."};
            let trickHtml = `<strong>Trick: ${escapeHtml(trick.title)}</strong><br>${escapeHtml(trick.text)}`;
            if (q.solution) trickHtml += `<div style="margin-top:10px; font-family:monospace; color:#ccc;"><strong>Walkthrough:</strong><br>${escapeHtml(q.solution)}</div>`;
            document.getElementById('review-trick').innerHTML = trickHtml;

            highlightReviewGrid();
        }

        function escapeHtml(s) {
            return String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Left/right arrow keys page through the review.
        document.addEventListener('keydown', e => {
            if (document.getElementById('review-screen').style.display !== 'block') return;
            if (e.key === 'ArrowLeft')  { e.preventDefault(); reviewStep(-1); }
            if (e.key === 'ArrowRight') { e.preventDefault(); reviewStep(1); }
        });

        function goToNextQuestion() {
            if (mode === 'test') { testModeIndex++; loadTestModeQuestion(); }
            else { loadQuestion(); }
        }

        refreshTestDropdowns();
    </script>
</body>
</html>
